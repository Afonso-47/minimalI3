#!/bin/sh

# --- cursor
exec_always --no-startup-id xsetroot -cursor_name left_ptr

# --- keyboard layout (pt)
exec_always --no-startup-id setxkbmap pt

# --- touchpad / trackpoint (T480 has both)
exec_always --no-startup-id xinput set-prop "SynPS/2 Synaptics TouchPad" "libinput Tapping Enabled" 1 2>/dev/null
exec_always --no-startup-id xinput set-prop "SynPS/2 Synaptics TouchPad" "libinput Natural Scrolling Enabled" 1 2>/dev/null

# --- screen backlight
# Install brightnessctl
bindsym XF86MonBrightnessUp exec --no-startup-id brightnessctl set +5%
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl set 5%-

# --- keyboard backlight (Fn+Space on the T480)
bindsym XF86KbdBrightnessUp exec --no-startup-id brightnessctl -d tpacpi::kbd_backlight set +1
bindsym XF86KbdBrightnessDown exec --no-startup-id brightnessctl -d tpacpi::kbd_backlight set 1-
