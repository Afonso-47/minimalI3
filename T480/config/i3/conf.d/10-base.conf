#!/bin/sh

# --- font (window titles and bar)
font pango:Iosevka Nerd Font 10

# --- gaps
gaps inner 8
gaps outer -4

# --- border
default_border pixel 0
default_floating_border pixel 2


# --- Color Scheme (gruvbox-dark, matches the bar colors in 30-autostart.conf)
#                       border   background  text   indicator  child_border
client.focused          $yellow  $bg1        $fg    $yellow    $yellow
client.focused_inactive $bg2     $bg1        $gray  $bg2       $bg2
client.unfocused        $bg2     $bg0        $gray  $bg2       $bg2
client.urgent           $red     $red        $bg0   $red       $red
client.placeholder      $bg0     $bg0        $fg    $bg0       $bg0
client.background       $bg0
