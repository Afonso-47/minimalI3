backend = "glx";
corner-radius = 8;


rules = (
  # 1. Default for all windows (lowest priority)
  {
    # No 'match' means this applies to every window that isn't overridden later
    mark-ovredir-focused = false;
    opacity = 1;
    inactive-opacity = 0.9;
  },
  # 2. i3bar override
  {
    match = "class_g = 'i3bar'";
    shadow = false;
    opacity = 0.8;
    corner-radius = 0;
  },
  # 3. Browser overrides – force full opacity
  {
    match = "class_g = 'Brave-browser'";
    opacity = 1;
    inactive-opacity = 1;
  },
  {
    match = "class_g = 'Chromium'";
    opacity = 1;
    inactive-opacity = 1;
  },
  {
    match = "class_g = 'Waterfox'";
    opacity = 1;
    inactive-opacity = 1;
  },
  {
    match = "class_g = 'LibreWolf'";
    opacity = 1;
    inactive-opacity = 1;
  }
);
