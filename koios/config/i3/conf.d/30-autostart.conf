#!/bin/sh

# Session-singleton services: only the local display (:0) should start
# these. The TigerVNC session runs its own separate Xvnc display (:1)
# with its own i3 instance reading this same config, so without this
# guard every "singleton" daemon below launches twice — once per
# display — causing duplicate auto-hide-bar loops, duplicate keyrings,
# conflicting polkit agents, etc. Gating each exec on $DISPLAY makes
# VNC behave like a window into the existing local session instead of
# spinning up a second one.

# --- GTK/Xft theming daemon (serves settings via XSETTINGS to GTK apps —
# without this, pcmanfm/Mousepad/etc silently ignore gtk-3.0/settings.ini)
exec --no-startup-id [ "$DISPLAY" = ":0" ] && xsettingsd

# --- Start XDG autostart .desktop files using dex.
exec --no-startup-id [ "$DISPLAY" = ":0" ] && dex --autostart --environment i3

# --- polkit auth agent
exec --no-startup-id [ "$DISPLAY" = ":0" ] && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# --- start keyring
exec --no-startup-id [ "$DISPLAY" = ":0" ] && /usr/bin/gnome-keyring-daemon --start --components=secrets

# --- Compositor (picom)
exec --no-startup-id [ "$DISPLAY" = ":0" ] && picom

# --- Notifications (dunst)
exec --no-startup-id [ "$DISPLAY" = ":0" ] && dunst

# --- Hide Bar Automatically
exec --no-startup-id [ "$DISPLAY" = ":0" ] && $HOME/.config/i3/scripts/auto-hide-bar.sh

# --- Dotfiles backup (tarball ~/.config + ~/.local on login, skipped if
# unchanged since last backup). Runs in the background so it never
# blocks login even on a slow first run.
exec --no-startup-id [ "$DISPLAY" = ":0" ] && $HOME/.config/i3/scripts/backup-dotfiles.sh &

# --- Wallpaper (feh) — cheap and harmless per-display, left ungated
exec_always --no-startup-id $HOME/.fehbg

# --- bar i3blocks
# Default mode is "dock" (always visible) — this is what the VNC
# session (:1) actually uses, since auto-hide-bar.sh only runs locally
# and nothing else would ever bring a hidden bar back on that display.
# The local session's auto-hide-bar.sh switches this to "hide" once it
# starts, layering hover/pin behavior on top of this safe default.
bar {
  status_command i3blocks
  position top
  tray_output primary
  mode dock

  colors {
    background #282828AA
    statusline #ebdbb2
    separator  #504945

    #                    border  backgr. text
    focused_workspace     #fabd2f #282828 #fabd2f
    active_workspace      #504945 #3c3836 #d5c4a1
    inactive_workspace    #282828 #282828 #665c54
    urgent_workspace      #fb4934 #fb4934 #282828
    binding_mode          #fb4934 #282828 #fb4934
  }
}
