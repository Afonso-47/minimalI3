backend = "glx";
vsync = true;
corner-radius = 8;

# --- Legacy option style, not `rules` ---
# picom's `rules` list silently drops every legacy exclude/opacity option
# (focus-exclude, shadow-exclude, blur-background-exclude, opacity-rule,
# etc — picom's own man page: "If window rules option is used, none of
# the above options will have any effect"). That's not a partial
# limitation, it's absolute. blur-background-exclude is the documented,
# confirmed-working fix for maim's selection screenshots coming out
# blurred (maim issue #130) — slop, the selection-box tool maim -s uses,
# spans the entire virtual screen as an override-redirect window, and
# without this exclude its background blur gets captured in the shot.
# Verified working live on this machine with a standalone legacy-only
# config before converting the whole file. Every rule below is written
# in legacy style specifically so this exclude actually takes effect.

# --- Fading ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# --- Background blur ---
# dual_kawase is the cheapest of picom's blur methods, strength 4 is a
# light blur. blur-background is on globally; opacity-rule below still
# controls which windows actually get dimmed (and therefore visibly
# blurred) based on focus, same end result as the old rules-based
# focused/unfocused split.
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-fixed = true;
blur-background-exclude = [
  "class_g = 'slop'",           # maim's selection overlay — the actual fix
  "class_g = 'Brave-origin'",
  "class_g = 'Chromium'",
  "class_g = 'Waterfox'",
  "class_g = 'LibreWolf'",
];

# --- Shadows ---
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.25;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "class_g = 'slop'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
];

# --- Opacity ---
# Active window at full opacity, inactive windows dimmed slightly —
# same values as the old rules-based focused/unfocused split (1.0 vs 0.9).
inactive-opacity = 0.9;
active-opacity = 1.0;
opacity-rule = [
  "100:class_g = 'Brave-origin'",
  "100:class_g = 'Chromium'",
  "100:class_g = 'Waterfox'",
  "100:class_g = 'LibreWolf'",
  "80:class_g = 'i3bar'",
];

# --- Corners ---
# i3bar and slop get square corners; everything else keeps corner-radius above.
corner-radius-rules = [
  "0:class_g = 'i3bar'",
  "0:class_g = 'slop'",
];

# --- Focus handling ---
# slop always counts as focused, so grabbing it for a selection never
# makes the real window underneath register as unfocused/dimmed/blurred.
focus-exclude = [ "class_g = 'slop'" ];

# Mark override-redirect windows (like slop) as NOT automatically
# focused by default — we handle slop's focus explicitly above instead.
mark-ovredir-focused = false;
