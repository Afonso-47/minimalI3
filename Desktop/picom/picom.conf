backend = "glx";
vsync = true;
corner-radius = 8;

# NOTE on rule order: picom's `rules` list is evaluated per-option, and for
# each option the FIRST rule in the list that matches AND sets that option
# wins (later rules for the same option are ignored). So specific rules must
# come before general/catch-all ones, or the general rule silently "wins"
# and the specific one never applies. This is also why `inactive-opacity`
# doesn't belong inside a rule at all — it's a legacy top-level option, not
# a per-window rule property; the correct way to set opacity based on focus
# is a plain `opacity` field combined with a `focused` match.

# --- Fading ---
# Smooths out every opacity change picom makes below (focus dimming, window
# open/close) instead of snapping instantly. ~120ms fade, quick enough to
# not feel laggy.
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 4;

# --- Background blur ---
# dual_kawase is the cheapest of picom's blur methods (much lighter than
# gaussian/box), strength 4 is a light blur - enough to read as "blurred"
# without being a GPU hog. Only applied where it's actually visible: behind
# semi-transparent windows (dimmed/inactive ones, and the bar). Fully opaque
# focused windows explicitly skip it below since blurring behind something
# 100% opaque has zero visual effect and would just burn cycles.
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-fixed = true;

# --- Shadows ---
# Subtle by design per your ask: small radius, low opacity, no huge offset.
# NOTE: exclusions live in `rules` below (per-window `shadow = false`), not
# as a top-level `shadow-exclude` list — picom warns and ignores
# shadow-exclude entirely once `rules` is in use ("old-style rule options
# will have no effect"). Mixing the two styles is explicitly unsupported.
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.25;
shadow-offset-x = -6;
shadow-offset-y = -6;

rules = (
  # 1. Browser overrides – always force full opacity, focused or not, and
  #    skip blur (they're fully opaque anyway, nothing to blur through)
  {
    match = "class_g = 'Brave-browser'";
    opacity = 1;
    blur-background = false;
  },
  {
    match = "class_g = 'Chromium'";
    opacity = 1;
    blur-background = false;
  },
  {
    match = "class_g = 'Waterfox'";
    opacity = 1;
    blur-background = false;
  },
  {
    match = "class_g = 'LibreWolf'";
    opacity = 1;
    blur-background = false;
  },

  # 2. i3bar override – fixed opacity, no shadow, square corners. It's
  #    already permanently semi-transparent (opacity 0.8), so blur behind
  #    it is basically free visual polish, not extra cost from focus churn.
  {
    match = "class_g = 'i3bar'";
    shadow = false;
    opacity = 0.8;
    corner-radius = 0;
    blur-background = true;
  },

  # 2b. No shadow on rofi/dunst/menus/tooltips - shadows just look wrong
  #     on these (rules-based equivalent of the old shadow-exclude list)
  {
    match = "class_g = 'Rofi'";
    shadow = false;
  },
  {
    match = "class_g = 'Dunst'";
    shadow = false;
  },
  {
    match = "window_type = 'dropdown_menu'";
    shadow = false;
  },
  {
    match = "window_type = 'popup_menu'";
    shadow = false;
  },
  {
    match = "window_type = 'tooltip'";
    shadow = false;
  },

  # 3. Everything else: full opacity + no blur while focused (nothing to
  #    blur through when opaque), dimmed + blurred while unfocused. These
  #    must stay LAST since they'd otherwise win the "first match" race
  #    against rules 1-2 above.
  {
    match = "focused || group_focused";
    opacity = 1;
    blur-background = false;
  },
  {
    match = "!focused && !group_focused";
    opacity = 0.9;
    blur-background = true;
  },

  # 4. Default, applies to everything regardless of the rules above
  {
    mark-ovredir-focused = false;
  },
);
