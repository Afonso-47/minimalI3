#!/bin/sh

# --- GTK/Xft theming daemon (serves settings via XSETTINGS to GTK apps —
# without this, pcmanfm/Mousepad/etc silently ignore gtk-3.0/settings.ini)
exec --no-startup-id xsettingsd

# --- Wallpaper (feh)
exec_always --no-startup-id $HOME/.fehbg

# --- Start XDG autostart .desktop files using dex.
exec --no-startup-id dex --autostart --environment i3

# --- polkit auth agent
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# --- start keyring
exec --no-startup-id /usr/bin/gnome-keyring-daemon --start --components=secrets

# --- Compositor (picom)
exec --no-startup-id picom

# --- Notifications (dunst)
exec --no-startup-id dunst

# --- Hide Bar Automatically
exec --no-startup-id $HOME/.config/i3/scripts/auto-hide-bar.sh

# --- bar i3blocks
bar {
  status_command i3blocks
  position top
  tray_output primary
  mode hide
  hidden_state hide

  colors {
    background #282828AA
    statusline #ebdbb2
    separator  #504945

    #                    border  backgr. text
    focused_workspace     #fabd2f #282828 #fabd2f
    active_workspace      #504945 #3c3836 #d5c4a1
    inactive_workspace    #282828 #282828 #665c54
    urgent_workspace      #fb4934 #fb4934 #282828
    binding_mode          #fb4934 #282828 #fb4934
  }
}
