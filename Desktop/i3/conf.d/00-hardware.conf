#!/bin/sh

# --- cursor
exec_always --no-startup-id xsetroot -cursor_name left_ptr

# --- keyboard layout (pt)
exec_always --no-startup-id setxkbmap pt

# --- Wacom tablet mapped to primary monitor (DP-0)
exec --no-startup-id ~/.local/bin/wacom-setup.sh

# --- monitor layout (dual monitor: DP-0 primary 2560x1440, HDMI-0 1920x1080)
exec --no-startup-id xrandr --output DP-0 --mode 2560x1440 --primary --pos 0x0 --output HDMI-0 --mode 1920x1080 --pos 2560x0
